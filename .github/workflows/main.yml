name: Build Highway TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate Godot project (unpacks an uploaded .zip if needed)
        run: |
          P=$(find . -name project.godot -not -path "*/.godot/*" -not -path "./_proj/*" | head -n 1)
          if [ -z "$P" ]; then
            Z=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$Z" ]; then
              echo "::error::No project.godot and no .zip found in the repo. Upload HighwayTV-stage4.zip (or its extracted contents)."
              ls -R | head -50
              exit 1
            fi
            echo "Unpacking $Z"
            mkdir -p _proj
            unzip -q -o "$Z" -d _proj
            P=$(find _proj -name project.godot -not -path "*/.godot/*" | head -n 1)
            [ -n "$P" ] || { echo "::error::$Z does not contain project.godot"; exit 1; }
          fi
          D=$(dirname "$P")
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project directory: $D"
          for f in export_presets.cfg scripts/main.gd scenes/main.tscn scenes/menu.tscn; do
            [ -f "$D/$f" ] || { echo "::error::Missing $D/$f - the project is incomplete."; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;35.0.1" "platforms;android-35" \
                  "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configure Godot editor for Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          cp ~/.config/godot/editor_settings-${GODOT_VERSION}.tres ~/.config/godot/editor_settings-4.tres
          keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Install Android gradle build template + Android TV manifest patch
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/build/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          if "LEANBACK_LAUNCHER" not in s:
              s, n = re.subn(
                  r'(<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>)',
                  r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
                  s, count=1)
              if n == 0:
                  sys.exit("ERROR: LAUNCHER category not found in manifest")
          feats = ""
          if "android.software.leanback" not in s:
              feats += '    <uses-feature android:name="android.software.leanback" android:required="false" />\n'
          if "android.hardware.touchscreen" not in s:
              feats += '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n'
          if feats:
              s = s.replace("<application", feats + "    <application", 1)
          if "android:banner" not in s:
              s = s.replace("<application", '<application android:banner="@mipmap/icon"', 1)
          if "LEANBACK_LAUNCHER" not in s:
              sys.exit("ERROR: manifest patch failed")
          p.write_text(s, encoding="utf-8")
          print("Android TV manifest patch applied")
          PY

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true

      - name: Export APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android TV" build/HighwayTV-debug.apk
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: HighwayTV-apk
          path: ${{ env.PROJECT_DIR }}/build/*.apk
